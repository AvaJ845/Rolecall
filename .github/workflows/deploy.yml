name: Build and deploy rolecalljobs.com

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "engine/**"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "17 */6 * * *" # refresh the board four times a day
  workflow_dispatch:

# Third-party and first-party actions are pinned to a full commit SHA, not a
# moving tag (P0-9): a compromised `vN` tag would otherwise run in the job that
# holds ROLECALL_SIGNING_KEY / CLOUDFLARE_API_TOKEN. Dependabot (.github/dependabot.yml)
# PRs the SHAs forward weekly; keep the `# vX.Y.Z` comment in sync when merging.

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Engine unit tests — Ed25519 (RFC 8032 vectors + negatives), SSRF guard,
  # classifier, board-shrink guard. Runs first and gates everything downstream:
  # a regression in the signing primitive must never reach a publish. No
  # secrets, no network, stdlib only.
  # ---------------------------------------------------------------------------
  engine-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run engine test suite
        run: python3 -m engine.tests

  # ---------------------------------------------------------------------------
  # Job A — pull feeds, classify, verify, export. Parses attacker-influenceable
  # data from the public internet, so it must NOT see the signing key.
  # ---------------------------------------------------------------------------
  build-board:
    runs-on: ubuntu-latest
    needs: engine-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Persist the engine's SQLite DB between runs so `first_seen` (and therefore
      # "new today") stays stable instead of resetting every build.
      - name: Restore engine state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-

      - name: Ingest → verify → export → stats
        run: |
          python3 -m engine ingest
          python3 -m engine verify 250 || true
          python3 -m engine export
          python3 -m engine stats

      - name: Save engine state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: engine-state-${{ github.run_id }}

      # Hand the exported board to the downstream jobs. The signing job needs
      # board.json; the deploy job needs it too (for the site build).
      - name: Upload board
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: board-data
          path: data/board.json
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job B — sign the board. The ONLY job that sees the signing secret, and it
  # runs exactly one command: `python3 -m engine sign`. No ingest, no verify, no
  # network. Blast radius: reads data/board.json, writes data/board.json.sig.
  # ---------------------------------------------------------------------------
  sign-board:
    runs-on: ubuntu-latest
    needs: build-board
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download board
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: board-data
          path: data

      - name: Sign the board
        env:
          ROLECALL_SIGNING_KEY: ${{ secrets.ROLECALL_SIGNING_KEY }}
        run: |
          if [ -n "$ROLECALL_SIGNING_KEY" ]; then
            python3 -m engine sign
          else
            echo "::warning::ROLECALL_SIGNING_KEY not set — board.json will ship unsigned and the app will reject remote updates."
          fi

      - name: Upload signature + v2 envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: board-sig
          path: |
            data/board.json.sig
            data/board.v2.json
          if-no-files-found: ignore
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job C — build the static site and deploy it. Gets board.json + signature as
  # artifacts; never signs anything itself.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: sign-board
    permissions:
      contents: read
    env:
      HAVE_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download board
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: board-data
          path: data

      - name: Download signature
        continue-on-error: true # absent when the signing secret is unset (see sign-board)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: board-sig
          path: data

      # SITE_BASE_URL: point the repo/Actions variable at https://rolecalljobs.com once the
      # custom domain is attached in Cloudflare Pages. Until then it builds for the
      # project's *.pages.dev URL.
      - name: Build site
        env:
          BASE_URL: ${{ vars.SITE_BASE_URL || 'https://rolecalljobs.com' }}
        run: python3 -m web build --base-url "$BASE_URL"

      - name: Sanity check
        run: |
          test -f web/dist/index.html
          test -f web/dist/board.json
          test -f web/dist/board/index.html
          grep -q "<title>" web/dist/index.html

      # Cloudflare Pages — needs two repo secrets:
      #   CLOUDFLARE_API_TOKEN   (token with the "Cloudflare Pages: Edit" permission)
      #   CLOUDFLARE_ACCOUNT_ID
      # and a Pages project named "rolecall" (create once:
      #   npx wrangler pages project create rolecall --production-branch main).
      - name: Deploy to Cloudflare Pages
        if: env.HAVE_CF == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=rolecall --branch=main --commit-dirty=true

      - name: Cloudflare not configured yet
        if: env.HAVE_CF != 'true'
        run: |
          echo "::warning::Site built to web/dist but not deployed. Add the CLOUDFLARE_API_TOKEN"
          echo "::warning::and CLOUDFLARE_ACCOUNT_ID repo secrets and create the 'rolecall' Pages project."
          ls -R web/dist | head -20
